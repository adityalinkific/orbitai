# ─────────────────────────────────────────────────────────
# Orbit Assistant — Master Configuration
# One file drives all intents, permissions, and thresholds.
# ─────────────────────────────────────────────────────────

confidence_threshold: 0.7
retry_attempts: 2
retry_backoff_seconds: 1
confirmation_timeout_seconds: 60
context_history_size: 10
session_timeout_minutes: 30

llm:
  provider: "groq"
  model: "llama3-8b-8192"


# ─────────────────────────────────────────────────────────
# Intent Registry — Per-intent RBAC + Service Mapping
# ─────────────────────────────────────────────────────────

intents:

  # ── Task Intents ──
  CREATE_TASK:
    allowed_roles: [super_admin, admin, manager]
    service: TaskService
    method: create_task
    description: "Create a new task"
    destructive: false
    examples:
      - create task
      - add task
      - new task
      - make a task
      - add a new task

  LIST_TASKS:
    allowed_roles: [super_admin, admin, manager, employee, intern]
    service: TaskService
    method: get_all_tasks
    description: "List all tasks"
    destructive: false
    examples:
      - list tasks
      - show tasks
      - all tasks
      - get tasks
      - display tasks

  GET_TASK:
    allowed_roles: [super_admin, admin, manager, employee, intern]
    service: TaskService
    method: get_task_detail
    description: "Get task details by ID"
    destructive: false
    examples:
      - get task
      - show task
      - task details
      - view task
      - task info

  UPDATE_TASK:
    allowed_roles: [super_admin, admin, manager]
    service: TaskService
    method: update_task
    description: "Update an existing task"
    destructive: false
    examples:
      - update task
      - modify task
      - edit task
      - change task
      - update task details

  DELETE_TASK:
    allowed_roles: [super_admin, admin, manager]
    service: TaskService
    method: delete_task
    description: "Delete a task"
    is_destructive: true
    examples:
      - delete task
      - remove task
      - erase task
      - cancel task

  ASSIGN_TASK:
    allowed_roles: [super_admin, admin, manager]
    service: TaskAssignService
    method: assign_task
    description: "Assign a task to a user"
    destructive: false
    examples:
      - assign task
      - give task
      - allocate task
      - assign task to user

  LIST_MY_TASKS:
    allowed_roles: [super_admin, admin, manager, employee, intern]
    service: TaskAssignService
    method: get_my_tasks
    description: "List tasks assigned to you"
    destructive: false
    examples:
      - my tasks
      - list my tasks
      - show my tasks
      - my assigned tasks
      - what are my tasks

  # ── Project Intents ──
  CREATE_PROJECT:
    allowed_roles: [super_admin, admin, manager]
    service: ProjectService
    method: create_project
    description: "Create a new project"
    destructive: false
    examples:
      - create project
      - start project
      - add project
      - new project
      - make a project

  LIST_PROJECTS:
    allowed_roles: [super_admin, admin, manager, employee, intern]
    service: ProjectService
    method: get_all_projects
    description: "List all projects"
    destructive: false
    examples:
      - list projects
      - show projects
      - all projects
      - get projects
      - display projects

  GET_PROJECT:
    allowed_roles: [super_admin, admin, manager, employee, intern]
    service: ProjectService
    method: get_project_by_id
    description: "Get project details by ID"
    destructive: false
    examples:
      - get project
      - show project
      - project details
      - view project
      - project info

  UPDATE_PROJECT:
    allowed_roles: [super_admin, admin, manager]
    service: ProjectService
    method: update_project
    description: "Update an existing project"
    destructive: false
    examples:
      - update project
