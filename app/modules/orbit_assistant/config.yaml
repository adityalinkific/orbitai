# ─────────────────────────────────────────────────────────
# Workflows — Multi-step compound operations
# ─────────────────────────────────────────────────────────

workflows:
  HIRE_CANDIDATE:
    allowed_roles: [super_admin, admin]
    description: "Hire a new candidate (multi-step workflow)"
    steps:
      - intent: ADD_MEMBER
        description: "Register employee profile"
      - intent: ASSIGN_TASK
        description: "Assign onboarding tasks"
        data:
          task_id: 1
        data_map:
          user_id: "{id}"

  START_PROJECT:
    allowed_roles: [super_admin, admin, manager]
    description: "Start a new project (multi-step workflow)"
    steps:
      - intent: CREATE_PROJECT
        description: "Create the project"
      - intent: CREATE_TASK
        description: "Create initial kickoff task"
        data:
          title: "Project Kickoff"
          priority: "high"
          task_type: "daily"
        data_map:
          project_id: "{id}"
          department_id: "{department_id}"   # ADD THIS


