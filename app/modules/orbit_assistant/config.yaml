      - edit project
      - change project
      - rename project

  DELETE_PROJECT:
    allowed_roles: [super_admin, admin, manager]
    service: ProjectService
    method: delete_project
    description: "Delete a project"
    is_destructive: true
    examples:
      - delete project
      - remove project
